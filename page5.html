<script>
    alert ('welcome to projects')
    let phoneNumber = "";
let isValid = false;

// Regex checks for exactly 10 digits (adjust as needed for your country)
const phonePattern = /^\d{11}$/; 

while (!isValid) {
    phoneNumber = prompt("Enter your 11-digit phone number (numbers only) its is a joke you can add any number like 12345678910:");
    
    // If user clicks "Cancel", break the loop
    if (phoneNumber === null) {
        alert("Input cancelled.");
        break;
    }

    // Validate the input against the pattern
    if (phonePattern.test(phoneNumber)) {
        isValid = true;
        alert("Success! Phone number saved: " + phoneNumber);
    } else {
        alert("Invalid input! Please make sure it is exactly 10 digits.");
    }
}

</script>
