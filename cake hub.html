<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CakeHub | Luxury Bakery</title>

<style>
:root{
    --pink:#e85d88;
    --pink2:#d84672;
    --pink-light:#ffdce8;
    --cream:#fff9f5;
    --white:#fff;
    --brown:#351c1c;
    --brown-light:#735957;
    --gold:#d9a441;
    --border:#efdfda;
    --shadow:0 20px 60px rgba(70,30,30,.12);
    --radius:28px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--cream);
    color:var(--brown);
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* ================= LOADER ================= */

#loader{
    position:fixed;
    inset:0;
    background:var(--cream);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:.7s;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-content{
    text-align:center;
}

.loader-cake{
    font-size:70px;
    animation:loaderBounce 1s infinite alternate;
}

.loader-title{
    margin-top:10px;
    font-size:25px;
    font-weight:900;
    letter-spacing:5px;
}

@keyframes loaderBounce{
    from{transform:translateY(0) rotate(-5deg)}
    to{transform:translateY(-18px) rotate(5deg)}
}

/* ================= BACKGROUND ================= */

.bg-circle{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:-2;
    filter:blur(3px);
    opacity:.35;
    animation:bgFloat 9s infinite ease-in-out;
}

.circle1{
    width:260px;
    height:260px;
    background:#ffd0df;
    left:-120px;
    top:15%;
}

.circle2{
    width:230px;
    height:230px;
    background:#ffe4ae;
    right:-110px;
    top:55%;
    animation-delay:2s;
}

.circle3{
    width:180px;
    height:180px;
    background:#e2d1ff;
    left:45%;
    bottom:-80px;
    animation-delay:4s;
}

@keyframes bgFloat{
    50%{transform:translate(25px,-30px)}
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:5000;
    background:rgba(255,249,245,.72);
    backdrop-filter:blur(18px);
    border-bottom:1px solid transparent;
    transition:.3s;
}

header.scrolled{
    background:rgba(255,255,255,.94);
    border-bottom-color:#f0deda;
    box-shadow:0 10px 35px rgba(50,20,20,.08);
}

.navbar{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:25px;
    font-weight:950;
}

.logo-icon{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    border-radius:15px;
    color:white;
    background:linear-gradient(135deg,#e85d88,#ffabc4);
    box-shadow:0 10px 25px rgba(232,93,136,.3);
    transform:rotate(-5deg);
}

.logo span{
    color:var(--pink);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
    font-weight:750;
}

.nav-links a{
    position:relative;
    padding:8px 0;
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:2px;
    background:var(--pink);
    transition:.3s;
}

.nav-links a:hover::after{
    width:100%;
}

.nav-order{
    background:var(--brown);
    color:white;
    padding:12px 20px;
    border-radius:999px;
    box-shadow:0 10px 25px rgba(50,20,20,.15);
    transition:.3s;
}

.nav-order:hover{
    transform:translateY(-3px);
}

.menu-button{
    display:none;
    background:none;
    border:none;
    font-size:30px;
    color:var(--brown);
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;
    padding-top:140px;
    padding-bottom:80px;
    display:flex;
    align-items:center;
}

.hero-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.badge{
    display:inline-flex;
    padding:9px 15px;
    border-radius:999px;
    background:#ffeaf1;
    color:#b43f64;
    font-size:13px;
    font-weight:900;
    margin-bottom:20px;
    animation:pulseBadge 2.5s infinite;
}

@keyframes pulseBadge{
    50%{box-shadow:0 0 0 8px rgba(232,93,136,.06)}
}

.hero h1{
    font-size:clamp(50px,7vw,95px);
    line-height:.94;
    letter-spacing:-5px;
    margin-bottom:25px;
}

.hero h1 .pink{
    color:var(--pink);
}

.hero h1 .outline{
    color:transparent;
    -webkit-text-stroke:1.5px var(--brown);
}

.hero-description{
    max-width:600px;
    color:var(--brown-light);
    font-size:18px;
    line-height:1.6;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:15px 22px;
    border-radius:16px;
    font-weight:900;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.btn:hover{
    transform:translateY(-5px);
}

.btn-primary{
    background:linear-gradient(135deg,var(--pink),var(--pink2));
    color:white;
    box-shadow:0 15px 30px rgba(232,93,136,.28);
}

.btn-secondary{
    background:white;
    border:1px solid #eadbd7;
    box-shadow:0 10px 25px rgba(50,20,20,.06);
}

.hero-features{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin-top:30px;
    color:var(--brown-light);
    font-size:14px;
}

.hero-features strong{
    color:var(--brown);
}

/* ================= HERO CAKE ================= */

.hero-art{
    min-height:520px;
    position:relative;
    display:grid;
    place-items:center;
    transition:transform .2s ease;
}

.cake-scene{
    position:relative;
    width:390px;
    height:400px;
    animation:cakeFloat 5s infinite ease-in-out;
}

@keyframes cakeFloat{
    50%{transform:translateY(-15px)}
}

.plate{
    position:absolute;
    width:390px;
    height:70px;
    bottom:45px;
    border-radius:50%;
    background:linear-gradient(#fff,#eee2de);
    box-shadow:0 25px 35px rgba(60,25,25,.16);
}

.main-cake{
    position:absolute;
    width:300px;
    height:260px;
    left:45px;
    bottom:100px;
    filter:drop-shadow(0 25px 18px rgba(70,25,35,.18));
}

.cake-layer{
    position:absolute;
    left:0;
    width:100%;
    border-radius:18px 18px 25px 25px;
}

.layer-bottom{
    height:115px;
    bottom:0;
    background:linear-gradient(90deg,#ed8ca8,#fff0f4,#e9809e);
}

.layer-middle{
    height:95px;
    width:90%;
    left:5%;
    bottom:90px;
    background:linear-gradient(90deg,#fff4ed,#ffe3dc,#f7b6ae);
}

.layer-top{
    height:80px;
    width:76%;
    left:12%;
    bottom:165px;
    background:linear-gradient(90deg,#f4b6c9,#fff5f7,#ed9db5);
}

.icing{
    position:absolute;
    left:12%;
    bottom:205px;
    width:76%;
    height:42px;
    background:#fff;
    border-radius:50% 50% 35% 35%;
}

.drip{
    position:absolute;
    background:white;
    width:17px;
    border-radius:0 0 12px 12px;
}

.drip1{
    height:35px;
    left:25%;
    bottom:186px;
}

.drip2{
    height:50px;
    left:43%;
    bottom:185px;
}

.drip3{
    height:30px;
    left:64%;
    bottom:190px;
}

.cherry{
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#d94061;
    left:48%;
    bottom:238px;
}

.cherry::before{
    content:"";
    position:absolute;
    width:28px;
    height:20px;
    border-left:3px solid #4d914e;
    border-radius:50%;
    left:12px;
    top:-15px;
    transform:rotate(35deg);
}

.sparkle{
    position:absolute;
    font-size:32px;
    animation:sparkle 2s infinite;
}

.sparkle1{
    left:15px;
    top:50px;
}

.sparkle2{
    right:15px;
    top:130px;
    animation-delay:.6s;
}

.sparkle3{
    left:30px;
    bottom:80px;
    animation-delay:1s;
}

@keyframes sparkle{
    50%{
        transform:scale(1.35) rotate(20deg);
        opacity:.5;
    }
}

.floating-card{
    position:absolute;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);
    padding:14px 17px;
    border-radius:18px;
    font-weight:850;
    box-shadow:var(--shadow);
    animation:cardFloat 4s infinite ease-in-out;
}

.card1{
    top:90px;
    right:0;
}

.card2{
    bottom:90px;
    left:0;
    animation-delay:1s;
}

@keyframes cardFloat{
    50%{transform:translateY(-10px)}
}

/* ================= SECTIONS ================= */

section{
    padding:100px 0;
}

.section-title{
    max-width:700px;
    margin:0 auto 45px;
    text-align:center;
}

.eyebrow{
    text-transform:uppercase;
    color:var(--pink);
    font-weight:950;
    letter-spacing:3px;
    font-size:12px;
}

.section-title h2{
    font-size:clamp(38px,5vw,65px);
    line-height:1;
    letter-spacing:-3px;
    margin:10px 0 15px;
}

.section-title p{
    color:var(--brown-light);
    line-height:1.6;
}

/* ================= FEATURES ================= */

.feature-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.feature-card{
    background:white;
    padding:22px;
    border:1px solid var(--border);
    border-radius:20px;
    display:flex;
    gap:14px;
    align-items:center;
    box-shadow:0 12px 30px rgba(70,30,30,.05);
    transition:.3s;
}

.feature-card:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow);
}

.feature-icon{
    font-size:30px;
}

.feature-card small{
    display:block;
    color:var(--brown-light);
    margin-top:3px;
}

/* ================= PRODUCTS ================= */

.cake-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.product{
    background:white;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 12px 35px rgba(70,30,30,.06);
    transition:.35s;
}

.product:hover{
    transform:translateY(-10px);
    box-shadow:var(--shadow);
}

.product-image{
    height:245px;
    display:grid;
    place-items:center;
    position:relative;
}

.product-bg1{
    background:linear-gradient(135deg,#fff0f5,#ffdce8);
}

.product-bg2{
    background:linear-gradient(135deg,#f8e6dc,#d8b09d);
}

.product-bg3{
    background:linear-gradient(135deg,#fff5c8,#f7d982);
}

.product-bg4{
    background:linear-gradient(135deg,#f1e8ff,#d7c3f5);
}

.product-bg5{
    background:linear-gradient(135deg,#e8f7ff,#bde7f6);
}

.product-bg6{
    background:linear-gradient(135deg,#ffe9dc,#ffc2a8);
}

.product-tag{
    position:absolute;
    top:14px;
    left:14px;
    background:white;
    padding:7px 11px;
    border-radius:999px;
    font-size:11px;
    font-weight:950;
}

.mini-cake{
    width:165px;
    height:135px;
    position:relative;
    filter:drop-shadow(0 15px 10px rgba(60,30,30,.16));
    transition:.4s;
}

.product:hover .mini-cake{
    transform:scale(1.08) rotate(-2deg);
}

.mini-bottom{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    border-radius:15px 15px 20px 20px;
    background:linear-gradient(90deg,#ef8faa,#fff0f2,#ea829e);
}

.mini-top{
    position:absolute;
    bottom:50px;
    left:10%;
    width:80%;
    height:55px;
    border-radius:15px 15px 20px 20px;
    background:linear-gradient(90deg,#fff,#ffe8ee,#f9b6c6);
}

.mini-cream{
    position:absolute;
    left:10%;
    bottom:96px;
    width:80%;
    height:24px;
    background:white;
    border-radius:50%;
}

.product-info{
    padding:22px;
}

.product-info h3{
    font-size:21px;
}

.product-info p{
    color:var(--brown-light);
    font-size:14px;
    line-height:1.5;
    margin:7px 0 15px;
}

.price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.price{
    color:var(--pink);
    font-weight:950;
}

/* ================= FLAVORS ================= */

.flavor-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.flavor{
    background:rgba(255,255,255,.8);
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    transition:.3s;
}

.flavor:hover{
    transform:translateY(-7px);
    background:white;
    box-shadow:var(--shadow);
}

.flavor-icon{
    font-size:35px;
}

.flavor h3{
    margin:8px 0 3px;
}

.flavor p{
    color:var(--brown-light);
    font-size:14px;
    line-height:1.5;
}

/* ================= ABOUT ================= */

.about{
    background:#2c1818;
    color:white;
    position:relative;
    overflow:hidden;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.about h2{
    font-size:clamp(40px,5vw,68px);
    line-height:1;
    letter-spacing:-3px;
    margin:10px 0 20px;
}

.about p{
    color:#d7c4c0;
    max-width:580px;
    line-height:1.7;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:30px;
}

.stat{
    padding:18px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
}

.stat strong{
    display:block;
    font-size:28px;
}

.stat span{
    color:#cdb9b5;
    font-size:12px;
}

.about-art{
    height:430px;
    border-radius:35px;
    background:linear-gradient(135deg,#f7a6bc,#ffe6df);
    display:grid;
    place-items:center;
    transform:rotate(2deg);
    box-shadow:0 30px 70px rgba(0,0,0,.25);
}

.about-art span{
    font-size:150px;
    filter:drop-shadow(0 20px 15px rgba(0,0,0,.15));
    animation:bigCake 3s infinite;
}

@keyframes bigCake{
    50%{
        transform:translateY(-12px) rotate(-5deg);
    }
}

/* ================= REVIEWS ================= */

.review-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.review{
    background:white;
    padding:27px;
    border:1px solid var(--border);
    border-radius:25px;
    box-shadow:0 10px 30px rgba(70,30,30,.05);
    transition:.3s;
}

.review:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow);
}

.stars{
    color:#e6a33f;
    letter-spacing:3px;
}

.review p{
    margin:16px 0;
    color:var(--brown-light);
    line-height:1.6;
}

.reviewer{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:850;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#ffe1ea;
}

/* ================= ORDER ================= */

.order-section{
    padding-top:60px;
}

.order-grid{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:30px;
}

.order-intro{
    background:linear-gradient(145deg,#3a2020,#241313);
    color:white;
    border-radius:30px;
    padding:35px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.order-intro::after{
    content:"🎂";
    position:absolute;
    font-size:180px;
    right:-45px;
    bottom:-65px;
    opacity:.1;
    transform:rotate(-15deg);
}

.order-intro h2{
    font-size:48px;
    line-height:1;
    margin:12px 0 18px;
    position:relative;
    z-index:2;
}

.order-intro p{
    color:#d9c6c3;
    position:relative;
    z-index:2;
    line-height:1.6;
}

.order-points{
    margin-top:28px;
    display:grid;
    gap:12px;
    position:relative;
    z-index:2;
}

.order-points div{
    display:flex;
    gap:10px;
    align-items:center;
}

.form-card{
    background:white;
    border:1px solid var(--border);
    border-radius:30px;
    padding:32px;
    box-shadow:var(--shadow);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-field{
    display:grid;
    gap:7px;
}

.form-field.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:900;
}

input,
select,
textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid #eadbd7;
    border-radius:14px;
    outline:none;
    background:#fffaf8;
    color:var(--brown);
    transition:.25s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 4px rgba(232,93,136,.1);
}

textarea{
    resize:vertical;
    min-height:115px;
}

.submit-area{
    grid-column:1/-1;
}

.submit-area .btn{
    width:100%;
    min-height:55px;
}

.success-message{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:13px;
    background:#e8f8ed;
    color:#28623a;
    font-weight:750;
    line-height:1.5;
}

.success-message.show{
    display:block;
}

/* ================= CONTACT ================= */

.contact-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.contact-box{
    background:white;
    border:1px solid var(--border);
    border-radius:22px;
    padding:25px;
    transition:.3s;
}

.contact-box:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow);
}

.contact-icon{
    font-size:32px;
}

.contact-box h3{
    margin:8px 0;
}

.contact-box p{
    color:var(--brown-light);
    line-height:1.6;
}

/* ================= FOOTER ================= */

footer{
    background:#241313;
    color:white;
    padding:45px 0 25px;
}

.footer-top{
    display:flex;
    justify-content:space-between;
    gap:30px;
}

.footer-description{
    max-width:430px;
    color:#c9b6b2;
    margin-top:12px;
    line-height:1.6;
}

.socials{
    display:flex;
    gap:10px;
}

.social{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:#382323;
    transition:.3s;
    font-weight:900;
}

.social:hover{
    transform:translateY(-5px);
    background:#543030;
}

.copyright{
    margin-top:35px;
    padding-top:20px;
    border-top:1px solid #432b2b;
    text-align:center;
    color:#a9918c;
    font-size:13px;
}

/* ================= TOAST ================= */

#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#241313;
    color:white;
    padding:15px 18px;
    border-radius:16px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    transform:translateY(120px);
    opacity:0;
    transition:.4s;
    z-index:10000;
    max-width:calc(100% - 30px);
}

#toast.show{
    transform:translateY(0);
    opacity:1;
}

/* ================= REVEAL ================= */

.reveal{
    opacity:0;
    transform:translateY(35px);
    transition:opacity .8s ease,transform .8s ease;
}

.reveal.visible{
    opacity:1;
    transform:translateY(0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:950px){

    .container{
        width:min(94%,760px);
    }

    .navbar{
        height:70px;
    }

    .nav-links{
        position:fixed;
        top:70px;
        left:0;
        right:0;
        display:none;
        flex-direction:column;
        background:rgba(255,255,255,.98);
