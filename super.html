<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umar's Celebration</title>
    <style>
        body {
            background-color: rgb(0, 7, 102);
            margin: 0;
            overflow: hidden; /* Changed to hidden to prevent scrollbars during explosions */
            position: relative;
            min-height: 100vh;
        }

        /* 🌈 Rainbow Header Styling */
        h1, h2, h3 {
            text-align: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        /* 🔮 Frosted Glass Container Card */
        .card {
            background-color: rgb(255, 255, 255);
            border-radius: 10px;
            padding: 25px;
            margin: 40px auto;
            max-width: 600px;
            border: black solid 2px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        /* 📄 Text Styling */
        p {
            color: #333333; 
            text-align: center;
            font-family: 'Arial', sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 10px 0;
        }

        .emoji-display {
            font-size: 2rem;
            margin: 10px;
            display: inline-block;
        }

        /* ⚡ Glowing Dynamic Button Setup */
        .glow-btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 15px 5px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .glow-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(127, 0, 255, 0.9);
        }

        /* 🎆 Fireworks Canvas Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking through the canvas to reach the button */
            z-index: 1;
        }
    </style>
</head>
<body>
    <audio id="shortcutSound" src="dragon-studio-fireworks-07-419025.mp3" ></audio>

    <!-- Canvas for rendering fireworks -->
    <canvas id="fireworksCanvas"></canvas>

    <div class="card">
        <h1>🎉 congratulations for 114 views and 42 clones of my web 🎉</h1>
        <div class="emoji-display">🚀✨💥</div>
        <p>Click the button below to launch spectacular fireworks into the night sky!</p>
        <button class="glow-btn" id="celebrateBtn" onclick="document.getElementById('shortcutSound').play()">
         celebrate
        </button>
        <p>thanks for support me thanks</p>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('celebrateBtn');

        // Resize canvas to match browser window dimensions
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let particles = [];
        let rockets = [];

        // Helper constructor for rocket projectiles going up
        class Rocket {
            constructor(targetX, targetY) {
                this.x = Math.random() * canvas.width; // Start from random bottom position
                this.y = canvas.height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 9;
                
                
                // Calculate angles and distances to flight paths
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                this.velX = (dx / dist) * this.speed;
                this.velY = (dy / dist) * this.speed;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            }

            update() {
                this.x += this.velX;
                this.y += this.velY;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Helper constructor for particle explosion shards
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                
                // Explode outwards radially
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.velX = Math.cos(angle) * speed;
                this.velY = Math.sin(angle) * speed;
                
                this.gravity = 0.12;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }

            update() {
                this.velY += this.gravity; // Apply gravitational pull downward
                this.x += this.velX;
                this.y += this.velY;
                this.alpha -= this.decay; // Gradually fade away
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Spawn a batch of firework rockets
        function launchFireworks() {
            const amount = 5; // Number of rockets launched per click
            for (let i = 0; i < amount; i++) {
                // Set targets within the top half of the screen
                const targetX = Math.random() * canvas.width;
                const targetY = Math.random() * (canvas.height * 0.4) + 50; 
                rockets.push(new Rocket(targetX, targetY));
            }
        }

        // Main animation system loop
        function animate() {
            // Semi-transparent clearing trail yields glow performance effects
            ctx.fillStyle = 'rgba(0, 7, 102, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Manage Rockets
            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw();

                // If rocket crosses past its intended target peak height, switch to explosion
                if (rockets[i].velY >= 0 || rockets[i].y <= rockets[i].targetY) {
                    // Create shard explosion particles
                    for (let p = 0; p < 60; p++) {
                        particles.push(new Particle(rockets[i].x, rockets[i].y, rockets[i].color));
                    }
                    rockets.splice(i, 1);
                }
            }

            // Manage Shard Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Action Trigger Configuration
        btn.addEventListener('click', launchFireworks);
        
        // Start processing background canvas loop immediately
        animate();
        
        // 1. Select the button element
const button = document.getElementById('celebrateBtn');

// 2. Create a new Audio object with the path to your sound file
const buttonSound = new Audio('dragon-studio-fireworks-07-419025');

// 3. Add a click event listener to play the sound
button.addEventListener('click', () => {
    // Reset audio to the start in case it is clicked rapidly
    buttonSound.currentTime = 0; 
    buttonSound.play();
});

    </script>
</body>
</html>
